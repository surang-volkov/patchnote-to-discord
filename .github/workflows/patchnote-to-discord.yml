name: patchnote-to-discord

on:
  schedule:
    # default set to every 30 minutes. edit it if needed.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # 오래된 캐시 삭제용
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Restore last guid
        uses: actions/cache/restore@v4
        with:
          path: last_guid.txt
          key: last-guid-${{ github.run_id }}
          restore-keys: |
            last-guid-

      - name: RSS check and send Discord Webhooks
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          STEAM_APPID: ${{ vars.STEAM_APPID }}
          DEBUG: ${{ vars.DEBUG }}
          COLOR: ${{ vars.COLOR }}
          EMBED_DESC_LIMIT: ${{ vars.EMBED_DESC_LIMIT }}
          LANGUAGE: ${{ vars.LANGUAGE }}
        run: python main.py

      - name: Save last guid
        if: hashFiles('last_guid.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: last_guid.txt
          key: last-guid-${{ github.run_id }}

      - name: Delete old caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key last-guid- --ref "${{ github.ref }}" \
            --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' \
            | xargs -r -n1 gh cache delete
